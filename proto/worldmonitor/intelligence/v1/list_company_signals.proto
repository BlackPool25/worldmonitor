syntax = "proto3";

package worldmonitor.intelligence.v1;

import "sebuf/http/annotations.proto";

// Request to discover and classify company intelligence signals from authoritative
// sources (SEC 8-K material events, earnings surprises, news mentions). Provide a
// ticker for the strongest match, or a company name matched against the SEC registry.
message ListCompanySignalsRequest {
  // domain was removed: matching a domain label against filer names is a guess,
  // and the only field that could confirm it (the SEC-registered website) is
  // left empty by SEC in practice, so the lookup could never be confirmed.
  reserved 2;
  reserved "domain";

  // Company name to discover signals for.
  string company = 1 [(sebuf.http.query) = {name: "company"}];
  // Exchange ticker symbol, such as "AAPL". Preferred lookup key.
  string ticker = 3 [(sebuf.http.query) = {name: "ticker"}];
}

// Discovered company signals with classification and engagement metrics.
message ListCompanySignalsResponse {
  // domain only ever echoed the request field of the same name, which is gone.
  reserved 2;
  reserved "domain";

  string company = 1;
  repeated CompanySignal signals = 3;
  SignalSummary summary = 4;
  
  // Unix timestamp in milliseconds when signals were discovered.
  int64 discovered_at_ms = 5 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];

  // SEC Central Index Key of the resolved filer (zero-padded 10 digits). Empty
  // when the company did not resolve — this is what distinguishes "no such
  // company" from "resolved company with no recent signals".
  string cik = 6;

  // True when the SEC ticker registry could not be read at all, so this empty
  // envelope means "could not look up", not "no such company". Responses with
  // this set are never cached.
  bool unavailable = 7;
}

message CompanySignal {
  // Classification type (e.g. "Hiring", "Product Launch", "Expansion").
  string type = 1;
  string title = 2;
  string url = 3;
  string source = 4;
  
  // Data quality tier (1 is authoritative, 5 is low confidence).
  int32 source_tier = 5;
  
  // Unix timestamp in milliseconds of the event occurrence.
  int64 timestamp_ms = 6 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  
  // Qualitative strength of the signal (e.g. "Strong", "Emerging").
  string strength = 7;
  
  SignalEngagement engagement = 8;
}

message SignalEngagement {
  int32 points = 1;
  int32 comments = 2;
  int32 stars = 3;
  int32 forks = 4;
  int32 mentions = 5;
}

message SignalSummary {
  int32 total_signals = 1;
  map<string, int32> by_type = 2; // Count of signals per type.
  CompanySignal strongest_signal = 3;
  int32 signal_diversity = 4; // Number of unique sources/types.
}
