syntax = "proto3";

package worldmonitor.intelligence.v1;

import "sebuf/http/annotations.proto";

// Request to fetch enrichment data for a company. Provide at least one of ticker,
// name, or domain. Ticker gives the strongest match (authoritative SEC CIK
// resolution plus market data); name and domain are matched against the SEC
// company registry.
message GetCompanyEnrichmentRequest {
  // Company domain, such as "apple.com". Accepted only when it matches one SEC
  // filer unambiguously and that filer registered the same website.
  string domain = 1 [(sebuf.http.query) = {name: "domain"}];
  // Company name, such as "Apple Inc".
  string name = 2 [(sebuf.http.query) = {name: "name"}];
  // Exchange ticker symbol, such as "AAPL". Preferred lookup key.
  string ticker = 3 [(sebuf.http.query) = {name: "ticker"}];
}

// Company enrichment composite aggregated from SEC EDGAR (identity + filings),
// Finnhub (market profile + earnings surprises), and the news corpus (mentions).
message GetCompanyEnrichmentResponse {
  // github, tech_stack, hacker_news_mentions were removed with the unsound
  // domain-slug attribution heuristic (issues #3754, #3755).
  reserved 2, 3, 5;
  reserved "github", "tech_stack", "hacker_news_mentions";

  EnrichedCompany company = 1;
  SecFilings sec_filings = 4;

  // Unix timestamp in milliseconds when this data was fetched.
  int64 enriched_at_ms = 6 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];

  // List of sources successfully reached (e.g. "sec_edgar", "finnhub", "news").
  repeated string sources = 7;

  // Exchange/market profile for the resolved ticker.
  CompanyMarketProfile market = 8;

  // Historical actual-vs-estimate EPS results, most recent first.
  repeated EarningsSurprise earnings_surprises = 9;

  // Recent news headlines mentioning the company, most recent first.
  repeated CompanyNewsMention news_mentions = 10;

  // True when the SEC ticker registry could not be read at all, so this empty
  // envelope means "could not look up", not "no such company". Responses with
  // this set are never cached.
  bool unavailable = 11;
}

message EnrichedCompany {
  // founded was removed: no free authoritative source provides founding year.
  reserved 6;
  reserved "founded";

  string name = 1;
  string domain = 2;
  // Industry classification (SEC SIC description).
  string description = 3;
  // Business location, such as "Cupertino, CA".
  string location = 4;
  string website = 5;
  // SEC Central Index Key (zero-padded 10 digits), empty when no EDGAR match.
  string cik = 7;
  // Resolved primary ticker symbol.
  string ticker = 8;
}

message CompanyMarketProfile {
  string exchange = 1;
  // Industry classification from Finnhub.
  string industry = 2;
  // Market capitalization in millions of USD.
  double market_cap_musd = 3;
  // IPO date (YYYY-MM-DD), empty when unknown.
  string ipo_date = 4;
  string logo_url = 5;
  // Company headquarters country code.
  string country = 6;
  string currency = 7;
}

message EarningsSurprise {
  // Fiscal period end date (YYYY-MM-DD).
  string period = 1;
  double actual_eps = 2;
  double estimate_eps = 3;
  // actual minus estimate.
  double surprise = 4;
  double surprise_percent = 5;
  int32 year = 6;
  int32 quarter = 7;
}

message CompanyNewsMention {
  string title = 1;
  string url = 2;
  string source = 3;

  // Unix timestamp in milliseconds when the story was published (0 when unknown).
  int64 published_at_ms = 4 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
}

message SecFilings {
  // Total filings known for this CIK in the recent EDGAR submissions window.
  int32 total_filings = 1;
  repeated SecFiling recent_filings = 2;
}

message SecFiling {
  string form = 1;
  string file_date = 2; // ISO 8601 date (YYYY-MM-DD)
  string description = 3;
  // Link to the filing index on sec.gov.
  string url = 4;
  // 8-K item codes disclosed in this filing (e.g. "2.02"), empty for other forms.
  repeated string items = 5;
}
