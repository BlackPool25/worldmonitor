name: Deploy changed Railway services

# Railway's Watch Paths remain a useful build-cost control, but their matcher
# is not a correctness boundary. This workflow computes the changed service
# scopes in repository code and asks Railway to deploy the latest source commit
# explicitly for each filtered service whose scope changed.
on:
  push:
    branches: [main]

# Do not add a fixed concurrency group here: GitHub keeps only one pending run
# per group and replaces it when another main push arrives. Every push must get
# its own diff range so closure changes cannot be silently skipped.

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment's branch policy must be restricted to main. Keeping the
    # production token here, rather than at repository scope, prevents a manual
    # or forked workflow ref from accessing it.
    environment:
      name: ingestion-acceptance-production
      deployment: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # The push's before SHA can be several commits behind after a batch
          # merge. Full history makes the range diff authoritative; if it still
          # cannot be resolved, the trigger script fails closed to all filtered
          # services.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pinned Railway CLI
        run: npm install --global --ignore-scripts @railway/cli@5.30.1

      - name: Verify Railway production context
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_PRODUCTION_TOKEN is required for production deploy triggers."
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "::error::RAILWAY_PROJECT_ID Actions environment variable is required for production deploy triggers."
            exit 1
          fi
          timeout 60s railway status --project "$RAILWAY_PROJECT_ID" --environment production --json > /dev/null
          echo "Project-scoped Railway token is valid for the expected production context."

      - name: Deploy changed Railway services from latest source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail
          node scripts/trigger-railway-deploys.mjs \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --environment production \
            --project "$RAILWAY_PROJECT_ID"
